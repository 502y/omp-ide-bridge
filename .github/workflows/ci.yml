name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/vscode-extension/package-lock.json
      - name: Install VS Code dependencies
        working-directory: packages/vscode-extension
        run: npm ci
      - name: Check and build VS Code extension
        working-directory: packages/vscode-extension
        run: npm run typecheck && npm run compile && npm run smoke
      - name: Install OMP extension dependencies
        working-directory: packages/omp-extension
        run: bun install --frozen-lockfile
      - name: Check and test OMP extension
        working-directory: packages/omp-extension
        run: bunx tsc --noEmit && bun test

  jetbrains:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify plugin
        working-directory: packages/jetbrains-plugin
        run: ./gradlew --no-daemon buildPlugin verifyPlugin
