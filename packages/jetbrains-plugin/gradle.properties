# Target IntelliJ Platform used at compile time. plugin.xml since-build is 233
# (2023.3+); this only selects the SDK the plugin is compiled against.
platformType=IC
platformVersion=2024.3.1

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# The IntelliJ Platform already bundles the Kotlin stdlib; do not add another copy.
kotlin.stdlib.default.dependency=false
